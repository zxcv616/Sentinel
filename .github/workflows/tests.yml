name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} + Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install JavaScript dependencies
        run: npm --prefix cloudflare ci
      - name: Python tests (including cross-runtime parity)
        run: python -m pytest -q
      - name: JavaScript tests
        run: npm --prefix cloudflare test
      - name: Build replay assets
        run: npm --prefix cloudflare run build:assets
      - name: Check frontend syntax
        run: node --check src/sentinel/static/app.js
