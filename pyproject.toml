[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-awareness"
version = "0.1.0"
description = "Airspace and maritime awareness — OpenSky poller"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
sentinel = ["static/*", "reference/*.json"]
