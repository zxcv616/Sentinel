[opensky]
# Bay Area: latitude 37–39 N, longitude 123–121 W.
lamin = 37.0
lamax = 39.0
lomin = -123.0
lomax = -121.0
poll_interval = 15.0
timeout = 20.0
backoff_initial = 15.0
backoff_max = 300.0

[tracks]
gap_after = 60.0
lost_after = 300.0
expire_after = 1800.0
history_size = 120
tick_interval = 1.0
# Horizontal Kalman model; uncertainty is model-based, not calibrated accuracy.
position_sigma_m = 100.0
velocity_sigma_mps = 50.0
acceleration_sigma_mps2 = 2.0
prediction_seconds = 60.0
filter_reset_seconds = 120.0

[recording]
# Relative to the directory from which Sentinel is launched.
raw_log_path = "data/raw.jsonl"
alert_log_path = "data/alerts.jsonl"

[alerts]
gap_seconds = 60.0
source_stale_seconds = 45.0
airport_radius_km = 8.0
recent_limit = 200
dedup_retention_seconds = 1800.0
# Empty uses the bundled regional airport reference.
airport_file = ""

# Vessel loitering is behavioral evidence, not an inference of intent.
loiter_radius_m = 500.0
loiter_seconds = 300.0
loiter_min_speed_mps = 1.0
loiter_min_distance_m = 100.0
loiter_max_gap_seconds = 90.0
